# Un seul lot de PR par semaine, groupé, pour ne pas noyer un side project à
# ~5 h/semaine sous les bumps.
version: 2

updates:
  - package-ecosystem: pip # lit pyproject.toml + poetry.lock
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
